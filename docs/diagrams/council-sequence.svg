<text x="174" y="361" class="s" text-anchor="middle">the files</text>
<polyline class="ln" points="230,392 252,392 252,408 239,408"/>
<polygon class="hd" points="241,403 231,408 241,413"/>
<rect class="bd" x="257" y="382.8" width="82.71" height="77.7" rx="3"/>
