<text x="118" y="103.04" class="b" text-anchor="middle">Claude</text>
<rect class="k-runner" x="168" y="70" width="124" height="56" rx="6"/>
<text x="230" y="93.54" class="b" text-anchor="middle">Runner</text>
<text x="230" y="112.54" class="s" text-anchor="middle">and run folder</text>
<rect class="k-work" x="307" y="64" width="86" height="56" rx="6"/>
