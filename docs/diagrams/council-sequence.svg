<text x="287" y="580" class="s" text-anchor="middle">worker on its</text>
<text x="287" y="599" class="s" text-anchor="middle">own copy, or</text>
<text x="287" y="618" class="s" text-anchor="middle">a Git worktree,</text>
<text x="287" y="637" class="s" text-anchor="middle">or, if you ask,</text>
<text x="287" y="656" class="s" text-anchor="middle">your live files</text>
<polyline class="ln dash" points="344,725 230,725"/>
<polyline class="ln" points="240,720 230,725 240,730"/>
<rect class="bd" x="245.65" y="680.8" width="82.69" height="39.7" rx="3"/>
<text x="287" y="695" class="s" text-anchor="middle">replies and</text>
<text x="287" y="714" class="s" text-anchor="middle">evidence</text>
<polyline class="ln" points="230,745 252,745 252,761 239,761"/>
<polygon class="hd" points="241,756 231,761 241,766"/>
<rect class="bd" x="257" y="735.8" width="82.71" height="39.7" rx="3"/>
<text x="260" y="750" class="s">save to the</text>
<text x="260" y="769" class="s">run folder</text>
<polyline class="ln" points="118,831 222,831"/>
<polygon class="hd" points="220,836 230,831 220,826"/>
<rect class="bd" x="142.24" y="786.8" width="63.53" height="39.7" rx="3"/>
<text x="174" y="801" class="s" text-anchor="middle">read the</text>
<text x="174" y="820" class="s" text-anchor="middle">results</text>
<polyline class="ln" points="118,889 222,889"/>
<polygon class="hd" points="220,894 230,889 220,884"/>
<rect class="bd" x="137.01" y="844.8" width="73.97" height="39.7" rx="3"/>
<text x="174" y="859" class="s" text-anchor="middle">check</text>
<text x="174" y="878" class="s" text-anchor="middle">freshness</text>
<polyline class="ln" points="118,909 140,909 140,925 127,925"/>
