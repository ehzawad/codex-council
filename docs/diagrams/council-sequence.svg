<text x="174" y="802" class="s" text-anchor="middle">freshness</text>
<polyline class="ln" points="118,833 140,833 140,849 127,849"/>
<polygon class="hd" points="129,844 119,849 129,854"/>
<rect class="bd" x="145" y="823.8" width="73.11" height="39.7" rx="3"/>
<text x="148" y="838" class="s">weigh the</text>
<text x="148" y="857" class="s">evidence</text>
<polyline class="ln dash" points="118,900 40,900"/>
