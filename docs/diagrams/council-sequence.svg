<polygon class="hd" points="220,760 230,755 220,750"/>
<rect class="bd" x="142.24" y="710.8" width="63.53" height="39.7" rx="3"/>
<text x="174" y="725" class="s" text-anchor="middle">read the</text>
<text x="174" y="744" class="s" text-anchor="middle">results</text>
<polyline class="ln" points="118,813 222,813"/>
<polygon class="hd" points="220,818 230,813 220,808"/>
