<text x="174" y="284" class="s" text-anchor="middle">write the brief</text>
<text x="174" y="303" class="s" text-anchor="middle">into the folder</text>
<polyline class="ln" points="118,372 222,372"/>
<polygon class="hd" points="220,377 230,372 220,367"/>
<rect class="bd" x="139.19" y="327.8" width="69.63" height="39.7" rx="3"/>
<text x="174" y="342" class="s" text-anchor="middle">snapshot</text>
<text x="174" y="361" class="s" text-anchor="middle">the files</text>
<polyline class="ln" points="230,392 252,392 252,408 239,408"/>
<polygon class="hd" points="241,403 231,408 241,413"/>
<rect class="bd" x="257" y="382.8" width="82.71" height="96.7" rx="3"/>
<text x="260" y="397" class="s">store the</text>
<text x="260" y="416" class="s">snapshot</text>
<text x="260" y="435" class="s">and a copy</text>
<text x="260" y="454" class="s">per worker</text>
<text x="260" y="473" class="s">by default</text>
