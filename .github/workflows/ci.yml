name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported floor through the newest release; 3.15 runs as a
        # prerelease until it ships.
        python-version: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      # Pinned: ruff 0.16 widened its default rule set, so an unpinned
      # `pipx run ruff` fails on code this repo's gate (0.15.x) accepts.
      # Bump deliberately together with any fixes the new rules demand.
      - name: Ruff
        run: pipx run --spec 'ruff==0.15.21' ruff check .
