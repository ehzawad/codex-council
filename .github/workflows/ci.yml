name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 exercises the pre-tomllib config fallback; 3.14 is current.
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Pinned: ruff 0.16 widened its default rule set, so an unpinned
      # `pipx run ruff` fails on code this repo's gate (0.15.x) accepts.
      # Bump deliberately together with any fixes the new rules demand.
      - name: Ruff
        run: pipx run --spec 'ruff==0.15.21' ruff check .
