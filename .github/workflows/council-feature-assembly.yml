name: Finalize collaboration implementation
on:
  push:
    branches: [codex/adaptive-collaboration-20261021]
    paths: ['.council-finalize-*.patch', '.github/workflows/council-feature-assembly.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: "startsWith(github.event.head_commit.message, 'chore: finalize captured collaboration')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply checked patches against the inspected head
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = '4eacb61bc68bb5dd724dc9a9df937c078038120b'
          for patch in .council-finalize-*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check
          python -m compileall -q plugins tests
      - name: Pinned lint
        run: pipx run --spec 'ruff==0.15.21' ruff check .
      - name: Verify changed behavior and compatibility contracts
        run: |
          PYTHONPATH=tests python -m unittest test_invocation_workflow test_documentation_contract test_codex_council.ComposePromptTests test_codex_council.ParseRolesJsonTests test_codex_council.InstructionListFormTests test_codex_council.RolesRewriteRecoveryTests test_codex_council.NoRunLevelDeadlineTests test_replies_and_overrides.CommandOverrideTests -v
          python -m unittest discover -s tests -p 'test_workflow_cli.py' -v
      - name: Publish source changes and remove temporary assembly files
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rm -- .council-finalize-*.patch .github/workflows/council-feature-assembly.yml
          git add plugins tests
          git diff --cached --check
          git config user.name 'Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix: bind captured permissions and finalize evidence and regression contracts'
          git push origin HEAD:refs/heads/codex/adaptive-collaboration-20261021
          printf 'Finalized source commit: %s\n' "$(git rev-parse HEAD)"
