name: Assemble collaboration feature
on:
  push:
    branches: [codex/adaptive-collaboration-20261021]
    paths: [.council-integrate.py]
permissions:
  contents: write
jobs:
  assemble:
    if: startsWith(github.event.head_commit.message, 'chore: assemble captured collaboration')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Integrate against the checked base
        run: python .council-integrate.py
      - name: Remove only obsolete unused imports
        run: pipx run --spec 'ruff==0.15.21' ruff check --fix --select F401 .
      - name: Check source and focused tests
        run: |
          python -m compileall -q plugins tests
          python -m unittest discover -s tests -p 'test_invocation_workflow.py' -v
          python -m unittest discover -s tests -p 'test_workflow_cli.py' -v
      - name: Publish ordinary source changes on the feature branch only
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          branch=codex/adaptive-collaboration-20261021
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          rm .council-integrate.py
          git config user.name 'Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'feat: integrate captured collaboration and evidence with the existing runner'
          git push origin "HEAD:refs/heads/$branch"
          printf 'Integrated feature commit: %s\n' "$(git rev-parse HEAD)"
