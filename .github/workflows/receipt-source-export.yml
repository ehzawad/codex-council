name: Export receipt prototype source
on:
  push:
    branches: [codex/optional-decision-receipts-20261022]
    paths: [.github/workflows/receipt-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    if: "startsWith(github.event.head_commit.message, 'chore: export pinned source')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/council-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: receipt-prototype-source
          path: ${{ runner.temp }}/council-source.tar.gz
          retention-days: 1
